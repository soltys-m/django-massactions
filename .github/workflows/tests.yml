name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        django-version: ['4.2', '5.0', '5.1']
        crispy-stack: ['current']
        include:
          # the oldest supported stack: django-crispy-forms 1.13, crispy-bootstrap5 0.x, modal forms 2.x
          - python-version: '3.12'
            django-version: '4.2'
            crispy-stack: 'legacy'

    name: py${{ matrix.python-version }} / Django ${{ matrix.django-version }} / crispy ${{ matrix.crispy-stack }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Django==${{ matrix.django-version }}.*"
          pip install pytest pytest-django pytest-cov
          pip install django-filter pycryptodome

      - name: Install crispy stack (current)
        if: matrix.crispy-stack == 'current'
        run: |
          pip install "django-crispy-forms>=2,<3" "crispy-bootstrap5>=2024" "django-bootstrap-modal-forms>=3,<4"

      - name: Install crispy stack (legacy)
        if: matrix.crispy-stack == 'legacy'
        run: |
          pip install "django-crispy-forms==1.13.*" "crispy-bootstrap5<0.8" "django-bootstrap-modal-forms>=2.2,<3"

      - name: Install package
        run: |
          pip install --no-deps -e .
          pip list | grep -i -E "^(Django|django-crispy-forms|crispy-bootstrap5|django-bootstrap-modal-forms|django-filter) "

      - name: Run tests
        run: |
          pytest --cov=massactions --cov-report=xml --cov-report=term

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pyflakes
        run: |
          python -m pip install --upgrade pip pyflakes
          pyflakes massactions setup.py runtests.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Smoke install the wheel
        run: |
          pip install dist/*.whl
          cd /tmp && python -c "import massactions; print('django-massactions', massactions.VERSION)"
