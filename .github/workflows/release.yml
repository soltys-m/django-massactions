name: Release

# Runs when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0).
# 1. builds sdist + wheel and checks that the tag matches massactions.VERSION
# 2. creates a GitHub release with the wheel attached (installable without PyPI)
# 3. publishes to PyPI through trusted publishing, only when the repository variable PUBLISH_TO_PYPI is
#    "true" (needs the "pypi" environment and a trusted publisher configured on pypi.org for this repository)

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import massactions; print(massactions.VERSION)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match massactions.VERSION $version"; exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pypi:
    # enabled by the repository variable PUBLISH_TO_PYPI=true (Settings -> Secrets and variables -> Actions -> Variables)
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
